# The paper preset: the single source of truth for the deck's look (Quarto's brand file).
# Every colour below is a token: nm<Name> in Beamer and TikZ (nmInk, nmConcept, nmDoG), --nm-<name> in the
# live deck, lecturekit.tokens.<NAME> in Python. Names are spelled as the LaTeX colour wants them (DoG, CSS, DN).
meta:
  name: lecturekit paper
color:
  palette:
    # surfaces and text
    paper: "#F3F2EE"
    slide: "#FFFFFF"
    ink: "#202B33"
    muted: "#566573"
    hairline: "#C8C3BA"
    # teaching roles (eyebrows, rules, coloured spans)
    concept: "#175B8E"
    caveat: "#A33A32"
    example: "#956000"
    anchor: "#006C65"
    question: "#70508C"
    # marks in figures and clips (input, state, update, context)
    input: "#0072B2"
    state: "#007F73"
    update: "#C45A00"
    context: "#7A5195"
    # project tokens: the four pRF models, distinguishable under deutan, protan and tritan vision against each
    # other and against the ink (CIELAB difference at least 19.6); future work is drawn dotted
    gauss: "#175B8E"
    DoG: "#B87400"
    CSS: "#B63564"
    DN: "#009999"
    future: "#7A5195"
  foreground: ink
  background: slide
  primary: concept
  secondary: muted
  tertiary: hairline
  success: anchor
  info: concept
  warning: example
  danger: caveat
  light: paper
  dark: ink
  link: concept
typography:
  # the bundled TeX Gyre faces (GUST font licence), from the vendored extension, so a build needs no installed font
  fonts:
    - family: TeX Gyre Heros
      source: file
      files:
        - path: _extensions/lecturekit/fonts/texgyreheros-regular.otf
          weight: 400
        - path: _extensions/lecturekit/fonts/texgyreheros-bold.otf
          weight: 700
        - path: _extensions/lecturekit/fonts/texgyreheros-italic.otf
          weight: 400
          style: italic
        - path: _extensions/lecturekit/fonts/texgyreheros-bolditalic.otf
          weight: 700
          style: italic
    - family: TeX Gyre Pagella
      source: file
      files:
        - path: _extensions/lecturekit/fonts/texgyrepagella-regular.otf
          weight: 400
        - path: _extensions/lecturekit/fonts/texgyrepagella-bold.otf
          weight: 700
        - path: _extensions/lecturekit/fonts/texgyrepagella-italic.otf
          weight: 400
          style: italic
        - path: _extensions/lecturekit/fonts/texgyrepagella-bolditalic.otf
          weight: 700
          style: italic
  base:
    family: TeX Gyre Heros
    size: 30px
    line-height: 1.4
  headings:
    family: TeX Gyre Pagella
    weight: 400
