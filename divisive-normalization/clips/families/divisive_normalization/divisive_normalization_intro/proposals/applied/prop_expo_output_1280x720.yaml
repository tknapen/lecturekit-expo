  kind: revise_spec
  created_at: '2026-11-09T10:30:00+00:00'
  author: lecturekit-expo (the divisive-normalization workspace)
  summary: Render at 1280 by 720, the size lk new --manim8 gives a deck's clips
  rationale: The deck shows the clip at 1280 by 720 at most; 1920 by 1080 only makes the committed fallback 
    larger. The frame rate stays 30 fps and the aspect ratio 16:9.
  in_response_to: []
  uncertainties: []
  claims: []
  targets:
    - file: animation.yaml
      patch:
        - op: replace
          path: /output/width_px
          value: 1280
        - op: replace
          path: /output/height_px
          value: 720
  touches_science: false
