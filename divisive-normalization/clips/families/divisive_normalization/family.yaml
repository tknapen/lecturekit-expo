schema_version: "1.0"
id: divisive_normalization
title: Divisive Normalization
style:
  name: lecturekit_paper
  version: "0.1.0"
environment:
  manager: uv
  project_root: "."
  lockfile: "uv.lock"
  install_policy: explicit
system_requirements:
  - kind: library
    name: cairo
    note: "pycairo links against the system Cairo library on Linux."
  - kind: font
    name: "DejaVu Sans"
    optional: true
    note: "Falls back to the style's font_fallbacks when absent."
shared_assets: []
components:
  - text_caption
  - scientific_plot
  - function_plot
  - surface_plot
  - function_image
  - equation_block
  - equation_label
  - comparison_plot
  - caption_with_citation
  - schematic_population
  - receptive_field_glyph
  - network_graph
  - sphere
schema_extensions: []
