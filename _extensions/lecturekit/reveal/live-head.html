<meta name="lecturekit" content="live">
<script>
// The live deck's runtime: clips, the presenter's keys, flash slides and the pacing clock.
//
// Clips. The filter marks each .movie video data-lk-autoplay rather than Reveal's data-autoplay, which would start
// every step of a sequence at once. A clip plays only while it is on stage: on the present slide, outside a hidden
// fragment, and not covered by a later visible step of its .r-stack. A clip that comes on stage starts from its first
// frame: on entering its slide (forwards, backwards or by a jump), when its fragment is shown, and when the step that
// covered it is hidden again. A clip that leaves the stage stops. A guard pauses any video that starts playing off
// stage, and the previews of the speaker view never play one.
//
// Keys go through Reveal's keyboard configuration, which Reveal consults before Quarto's bindings and its own
// defaults; keys pressed in the speaker window reach the same bindings through Reveal's triggerKey, in the preview,
// which hands clip actions to the main window:
//   Space    pauses or resumes the clip on stage; with no clip on stage, the next step (Shift+Space: the previous)
//   R        replays the clip on stage from its start, or re-runs a flash slide (Quarto's Scroll View key is not bound)
//   P        resets the pacing clock, and does not go to the previous slide
// A click on a clip pauses or resumes it.
//
// Flash slides: a slide with data-flash="500" shows its image for 500 ms after a short fixation cross, then blanks it;
// the title stays. Used for the brief-exposure trials of lecture 2.
//
// Pacing clock, in the speaker view: every slide heading carries data-timing (its planned seconds, from time=); the
// clock compares the elapsed time with the plan up to the current slide, turns red when more than a minute behind,
// and resets on P. The deck's budget comes from the title slide's data-budget.
(function () {
  var NS = 'lecturekit';
  function speaker() { return !!(window.Reveal && Reveal.isSpeakerNotes && Reveal.isSpeakerNotes()); }
  function play(v) { var p = v.play(); if (p && p.catch) p.catch(function () {}); }
  function restart(v) { try { v.currentTime = 0; } catch (e) { /* not seekable yet */ } play(v); }
  function toggle(v) { if (v.paused || v.ended) play(v); else v.pause(); }

  // ---------------------------------------------------------------- flash slides
  var timer = null;
  function flash(slide) {
    if (!slide || !slide.hasAttribute('data-flash')) return;
    var img = slide.querySelector('img'); if (!img) return;
    var ms = parseInt(slide.getAttribute('data-flash'), 10) || 500;
    if (img.getAttribute('data-src')) { img.src = img.getAttribute('data-src'); img.removeAttribute('data-src'); }
    var fix = slide.querySelector('.nm-fix');
    if (!fix) { fix = document.createElement('div'); fix.className = 'nm-fix'; fix.textContent = '+'; img.parentNode.insertBefore(fix, img); }
    if (timer) { clearTimeout(timer); timer = null; }
    img.style.visibility = 'hidden'; fix.style.visibility = 'visible';
    timer = setTimeout(function () {
      fix.style.visibility = 'hidden'; img.style.visibility = 'visible';
      timer = setTimeout(function () { img.style.visibility = 'hidden'; timer = null; }, ms);
    }, 600);
  }

  // ---------------------------------------------------------------- what is on stage
  function inHiddenFragment(el) {
    for (var n = el; n && n.tagName !== 'SECTION'; n = n.parentElement)
      if (n.classList.contains('fragment') && !n.classList.contains('visible')) return true;
    return false;
  }
  // a step of an .r-stack (the stack's child that is el or holds it) is covered once a later step is a visible fragment
  function covered(el) {
    for (var n = el; n && n.tagName !== 'SECTION'; n = n.parentElement) {
      var stack = n.parentElement;
      if (!stack || !stack.classList.contains('r-stack')) continue;
      for (var s = n.nextElementSibling; s; s = s.nextElementSibling)
        if (s.classList.contains('fragment') && s.classList.contains('visible')) return true;
    }
    return false;
  }
  // shown on the current slide, whichever window this is
  function visible(v) {
    var slide = window.Reveal && Reveal.getCurrentSlide();
    return !!slide && slide.contains(v) && !inHiddenFragment(v) && !covered(v);
  }
  // allowed to play: shown, and in the main window (never in a speaker-view preview)
  function onStage(v) { return !speaker() && visible(v); }
  function shownClips() {
    var slide = window.Reveal && Reveal.getCurrentSlide();
    return slide ? Array.prototype.filter.call(slide.querySelectorAll('video'), visible) : [];
  }
  // the clip the keys act on: the last one shown, the topmost step of a sequence
  function currentClip() { var cs = shownClips(); return cs.length ? cs[cs.length - 1] : null; }

  // Make every clip of the deck agree with the stage: one that has just come on stage starts from its first frame,
  // one still on stage is left as it is (playing, or paused by the presenter), one off stage stops.
  function stage() {
    document.querySelectorAll('.reveal .slides video').forEach(function (v) {
      var on = onStage(v);
      if (!on) { if (!v.paused) v.pause(); v.lkOnStage = false; return; }
      if (!v.lkOnStage && v.hasAttribute('data-lk-autoplay')) restart(v);
      v.lkOnStage = true;
    });
  }
  // the guard: a video that starts playing off stage is paused at once
  function guard(e) {
    var v = e.target;
    if (v && v.tagName === 'VIDEO' && !onStage(v)) v.pause();
  }
  document.addEventListener('play', guard, true);
  document.addEventListener('playing', guard, true);

  // ---------------------------------------------------------------- between windows
  // A key pressed in the speaker window reaches the preview's Reveal; clip actions are handed to the main window
  // (the speaker window's opener), the pacing clock is reset in every window that shows it.
  function tellMain(action) {
    var main = null;
    try { main = window.parent && window.parent !== window ? window.parent.opener : null; } catch (e) { main = null; }
    if (!main) return false;
    try { main.postMessage(JSON.stringify({ namespace: NS, action: action }), '*'); return true; } catch (e) { return false; }
  }
  var channel = null;
  try { channel = new BroadcastChannel(NS); } catch (e) { channel = null; }
  function tellClocks() {
    var msg = JSON.stringify({ namespace: NS, action: 'clock' });
    try { if (channel) channel.postMessage(msg); } catch (e) { /* no channel */ }
    try {   // the speaker window's other preview, also where the channel does not reach (file://)
      var frames = window.parent && window.parent !== window ? window.parent.frames : null;
      if (frames) for (var i = 0; i < frames.length; i++) if (frames[i] !== window) frames[i].postMessage(msg, '*');
    } catch (e) { /* not in a speaker view */ }
  }
  function receive(data) {
    if (typeof data === 'string') { if (data.indexOf(NS) < 0) return; try { data = JSON.parse(data); } catch (e) { return; } }
    if (!data || data.namespace !== NS) return;
    if (data.action === 'clock') resetClock();
    else if (speaker()) return;
    else if (data.action === 'toggle') { var v = currentClip(); if (v) toggle(v); }
    else if (data.action === 'replay') replay();
  }
  window.addEventListener('message', function (e) { receive(e.data); });
  if (channel) channel.onmessage = function (e) { receive(e.data); };

  // ---------------------------------------------------------------- the keys
  function replay() {
    var v = currentClip();
    if (v) { restart(v); return true; }
    var slide = Reveal.getCurrentSlide();
    if (slide && slide.hasAttribute('data-flash')) { flash(slide); return true; }
    return false;
  }
  function spaceKey(e) {
    if (!(e && e.shiftKey)) {
      var v = currentClip();
      if (v) { if (speaker()) tellMain('toggle'); else toggle(v); return; }
    }
    if (Reveal.isOverview()) Reveal.toggleOverview(false);
    var opts = { skipFragments: !!(e && e.altKey) };
    if (e && e.shiftKey) Reveal.prev(opts); else Reveal.next(opts);
  }
  function replayKey() {
    if (!speaker()) { replay(); return; }
    var slide = Reveal.getCurrentSlide();
    if (currentClip() || (slide && slide.hasAttribute('data-flash'))) tellMain('replay');
  }
  function clockKey() { resetClock(); tellClocks(); }

  function bindKeys() {
    var config = Reveal.getConfig();
    if (config.keyboard === false) return;
    var own = config.keyboard && typeof config.keyboard === 'object' ? config.keyboard : {};
    var keys = {}, ours = { 32: spaceKey, 80: clockKey, 82: replayKey };
    for (var k in own) keys[k] = own[k];
    for (var c in ours) if (!(c in keys)) keys[c] = ours[c];
    // Quarto binds R to Scroll View; the keyboard configuration wins over it, and the help overlay no longer lists it
    if (keys[82] === replayKey && Reveal.removeKeyBinding) Reveal.removeKeyBinding(82);
    Reveal.configure({ keyboard: keys });
  }

  // Clips carry no browser controls: a click on a clip on stage pauses or resumes it.
  document.addEventListener('click', function (e) {
    var v = e.target && e.target.closest ? e.target.closest('video') : null;
    if (v && visible(v)) { e.preventDefault(); if (speaker()) tellMain('toggle'); else toggle(v); }
  });

  // ---------------------------------------------------------------- pacing clock
  var start = null;
  function fmt(min) {
    var sign = min < 0 ? '-' : ''; min = Math.abs(min);
    var m = Math.floor(min), s = Math.round((min - m) * 60); if (s === 60) { m += 1; s = 0; }
    return sign + m + ':' + (s < 10 ? '0' : '') + s;
  }
  function planned() {
    var cur = Reveal.getCurrentSlide(), total = 0;
    var all = Array.prototype.slice.call(document.querySelectorAll('.reveal .slides section'));
    for (var i = 0; i < all.length; i++) {
      var t = parseFloat(all[i].getAttribute('data-timing') || '0');
      total += isNaN(t) ? 0 : t;
      if (all[i] === cur) return total / 60;
    }
    return null;
  }
  function tick() {
    if (!speaker()) return;
    var box = document.querySelector('.lk-pacing');
    if (!box) { box = document.createElement('div'); box.className = 'lk-pacing'; document.body.appendChild(box); }
    if (start === null) start = Date.now();
    var elapsed = (Date.now() - start) / 60000, plan = planned();
    var text = 'elapsed ' + fmt(elapsed);
    box.classList.remove('lk-behind', 'lk-ahead');
    if (plan !== null) {
      var diff = elapsed - plan;
      text += ' | plan ' + fmt(plan) + ' | ' + (diff > 0 ? '+' : '') + fmt(diff);
      if (diff > 1) box.classList.add('lk-behind'); else if (diff < -1) box.classList.add('lk-ahead');
    }
    var title = document.getElementById('title-slide');
    var budget = title && title.getAttribute('data-budget');
    if (budget) text += ' | budget ' + fmt(parseFloat(budget));
    box.textContent = text;
  }
  function resetClock() {
    start = Date.now();
    document.documentElement.setAttribute('data-lk-clock-reset', String(start));
    if (window.Reveal && Reveal.isReady && Reveal.isReady()) tick();
  }

  // ---------------------------------------------------------------- wiring
  function ready() {
    bindKeys();
    stage(); flash(Reveal.getCurrentSlide()); tick();
    Reveal.on('slidechanged', function (e) { stage(); flash(e.currentSlide); tick(); });
    Reveal.on('fragmentshown', stage);
    Reveal.on('fragmenthidden', stage);
    setInterval(tick, 1000);
  }
  window.addEventListener('load', function () {
    if (!window.Reveal) return;
    if (Reveal.isReady && Reveal.isReady()) ready(); else Reveal.on('ready', ready);
  });
})();
</script>
