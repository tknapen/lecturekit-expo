name: build

# Every project against the engine pinned in requirements.txt (pushes and pull requests), and every week against
# lecturekit's main branch (the schedule, or a manual run), so that an engine change that breaks a deck is seen
# here before it is released. Two jobs: clips renders each project's clips with Manim and manim8 and checks the
# index against the manifests; build builds every deck (both presets where expo.yaml declares dark) with those
# clips, runs the review checks and assembles the gallery. Pages is published from pushes to main only.

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"            # Mondays, 05:17 UTC: the projects against lecturekit's main
  workflow_dispatch:
    inputs:
      engine:
        description: "lecturekit to build with: main (its main branch) or pinned (the commit in requirements.txt)"
        type: choice
        options: [main, pinned]
        default: main

permissions:
  contents: read
  pages: write
  id-token: write

env:
  ENGINE: ${{ github.event_name == 'schedule' && 'main' || inputs.engine || 'pinned' }}

# one run per branch and engine at a time; a newer push to a work branch replaces its running build
concurrency:
  group: build-${{ github.ref }}-${{ github.event_name == 'schedule' && 'main' || inputs.engine || 'pinned' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  clips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The libraries Manim builds against, and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcairo2-dev libpango1.0-dev pkg-config ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: The engine (lecturekit with Manim and manim8)
        run: .github/scripts/install-engine.sh

      - name: Render the clips of every project that has them
        run: |
          source .venv/bin/activate
          # the lists go to files first: a command substitution in a for list, or a process substitution, would
          # hide the helper's exit status from bash -e, and a crashed helper would make this step a silent no-op
          python tools/projects.py --clips > "$RUNNER_TEMP/clips.txt"
          python tools/projects.py --clips --preset dark > "$RUNNER_TEMP/clips-dark.txt"
          mapfile -t projects < "$RUNNER_TEMP/clips.txt"
          [ "${#projects[@]}" -gt 0 ] || { echo "tools/projects.py lists no project with clips"; exit 1; }
          for p in "${projects[@]}"; do
            echo "== $p"
            lk clips "$p"
            if grep -qx "$p" "$RUNNER_TEMP/clips-dark.txt"; then lk clips "$p" --mode dark; fi
          done

      - name: Each manim8 clip in the index is its job's full movie, with its checkpoints
        run: |
          source .venv/bin/activate
          python tools/check_clips.py

      - uses: actions/upload-artifact@v4
        with:
          name: clips-${{ env.ENGINE }}
          path: "*/assets/clips/"
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clip-manifests-${{ env.ENGINE }}
          path: "*/clips/families/*/*/renders/*/*/manifest.json"
          if-no-files-found: ignore

  build:
    needs: clips
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9
          tinytex: true

      - name: TeX packages, fonts and the libraries Manim builds against
        run: |
          # tlmgr's exit status is informational: it also fails on a repository hiccup or a package it already has.
          # The kpsewhich line below is the gate: it fails when a file the two formats need is missing.
          # Quarto's TinyTeX is not on PATH by itself: put its bin directory there, for this step and the next.
          TT="$(dirname "$(find "$HOME/.TinyTeX" "$HOME/bin" -name tlmgr 2>/dev/null | head -1)" 2>/dev/null)"
          [ -n "$TT" ] && [ "$TT" != . ] && { export PATH="$TT:$PATH"; echo "$TT" >> "$GITHUB_PATH"; }
          command -v tlmgr > /dev/null || { echo "tlmgr not found: TinyTeX is not installed where Quarto puts it"; exit 1; }
          tlmgr install beamer adjustbox collectbox etoolbox ragged2e pgf xcolor standalone fontspec unicode-math \
            textcase lm lm-math varwidth caption booktabs || true
          for f in beamer.cls adjustbox.sty collectbox.sty etoolbox.sty ragged2e.sty tikz.sty xcolor.sty \
            standalone.cls fontspec.sty unicode-math.sty textcase.sty lmodern.sty latinmodern-math.otf \
            varwidth.sty caption.sty booktabs.sty; do
            kpsewhich "$f" > /dev/null || { echo "TeX is missing $f"; exit 1; }
          done
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lmodern fonts-lmodern libcairo2-dev libpango1.0-dev \
            pkg-config ffmpeg
          fc-cache -f

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: The engine (lecturekit and the review tools)
        run: |
          .github/scripts/install-engine.sh
          .venv/bin/playwright install --with-deps chromium

      - name: Metadata, and the vendored extension against the installed engine
        run: |
          source .venv/bin/activate
          if [ "$ENGINE" = main ]; then
            # against main the vendored copy is expected to lag: report the drift, then build with main's own copy
            python tools/check_meta.py --allow-extension-drift
            python tools/vendor_extension.py
          else
            python tools/check_meta.py
          fi

      - name: The clips rendered in the clips job
        uses: actions/download-artifact@v4
        with:
          name: clips-${{ env.ENGINE }}
          path: .

      - name: Build and review every project, both presets where declared
        run: |
          source .venv/bin/activate
          status=0
          # to a file first, so that a failing helper fails the step (a process substitution would hide its exit
          # status), then a list, so that no tool can read the loop's stdin
          python tools/projects.py --presets > "$RUNNER_TEMP/presets.txt"
          mapfile -t rows < "$RUNNER_TEMP/presets.txt"
          [ "${#rows[@]}" -gt 0 ] || { echo "tools/projects.py lists no project"; exit 1; }
          for row in "${rows[@]}"; do
            read -r p preset <<< "$row"
            echo "::group::$p ($preset)"
            out="_build"; brand="_brand.yml"; mode="light"; shots="shots"
            if [ "$preset" = dark ]; then out="_build-dark"; brand="_brand-dark.yml"; mode="dark"; shots="shots-dark"; fi
            if [ "$preset" = dark ]; then lk build "$p" --profile dark; else lk build "$p"; fi || { status=1; echo "::endgroup::"; continue; }
            # every check gates; overflow reads the log this build left beside the source, so it runs right after
            lk review overflow "$p" || status=1
            lk review contrast "$p/$brand" --mode $mode || status=1
            lk review shoot "$p/$out/slides-live.html" --out "$p/review/$shots" --sheet || status=1
            lk review measure "$p/$out/slides-live.html" || status=1
            lk review frags "$p/$out/slides-live.html" --out "$p/review/frags-$preset" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Assemble the gallery
        if: always()
        run: |
          [ -f .venv/bin/activate ] || { echo "no engine installed: an earlier step failed, so there is no gallery"; exit 1; }
          source .venv/bin/activate
          python tools/gallery.py --out site

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-${{ env.ENGINE }}
          path: site

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.ENGINE == 'pinned'
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
