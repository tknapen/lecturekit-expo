scientific_review_required: true
validation_warnings:
  - "action 'run_pulse' moves at constant speed from its first frame to its last (easing: linear); the style asks
    for slow in, slow out: omit `easing` to use `smooth`, or keep linear only for a motion that should read as mechanical"
  - "action 'emit_prediction' moves 'modelling_loop' -0.00s after 'feed_loop' has finished; the style asks for a
    rest of 0.5s so the end state is seen before it changes again: start it later or lengthen its lead-in"
  - scene 'chain' names pattern 'reveal_in_reading_order' but uses none of its components (text_caption, 
    caption_with_citation, equation_label, equation_block, schematic_population, network_graph)
