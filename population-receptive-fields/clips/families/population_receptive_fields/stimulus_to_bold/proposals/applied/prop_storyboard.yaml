scientific_review_required: true
validation_warnings:
  - "action 'clock' moves at constant speed from its first frame to its last (easing: linear); the style asks for
    slow in, slow out: omit `easing` to use `smooth`, or keep linear only for a motion that should read as mechanical"
  - "action 'marks_off' moves 'run' 0.00s after 'clock' has finished; the style asks for a rest of 0.5s so the end
    state is seen before it changes again: start it later or lengthen its lead-in"
  - scene 'one_run' names pattern 'let_time_run' but uses none of its components (surface_plot, function_plot,
    function_image)
  - scene 'one_run' names pattern 'linked_views' but uses none of its components (function_plot, surface_plot,
    function_image)
