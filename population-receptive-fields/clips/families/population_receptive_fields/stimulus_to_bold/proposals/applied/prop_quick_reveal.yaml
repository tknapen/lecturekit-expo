schema_version: '1.0'
proposal:
  schema_version: '1.0'
  id: prop_quick_reveal
  kind: revise_spec
  created_at: '2026-11-13T18:00:00+00:00'
  author: agent:fixer
  summary: Reveal the layout over 0.1 s instead of the style's 0.85 s, so it stands complete from frame 3.
  rationale: "The timeline's hard milestone `layout` sits at 0 s with tolerance 0, and the original scene shows
    the layout from its first frame. manim8 bad3ae1 reveals every object from alpha 0 at the scene start over the
    style's `motion.reveal_seconds`, which must be greater than 0 (scianim_core/style.py: `reveal_seconds: float
    = Field(gt=0)`), so the milestone cannot be met exactly: frame 0 stays the page colour. A project override of
    `motion.reveal_seconds` (on manim8's allowlist for a project) brings the complete layout from 0.85 s to 0.1
    s. This clip reveals nothing after the scene start (the bar, the cursor and the dots enter through `marks_on`,
    a `vary_parameter` with its own 0.2 s), so no later fade changes; the clock still starts at 1.0 s and ends at
    11.0 s. The override is the project's own, so it applies under both bridged styles alike: geometry, timing and
    frame count stay identical under paper and dark. Answers the uncertainty of prop_storyboard on the reveal."
  based_on_revision: working
  in_response_to: []
  uncertainties:
    - 'Frame 0 is still the empty page: the hard milestone `layout` at 0 s is missed by 0.1 s rather than 0.85 s.
      The lecturer decides whether that deviation is accepted.'
  claims: []
  targets:
    - file: animation.yaml
      patch:
        - op: replace
          path: /style/overrides
          value:
            motion.reveal_seconds: 0.1
  touches_science: false
