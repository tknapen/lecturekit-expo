schema_version: '1.0'
proposal:
  schema_version: '1.0'
  id: prop_layout_and_outline
  kind: revise_storyboard
  created_at: '2026-11-13T16:20:00+00:00'
  author: agent:clip-fields_to_map
  summary: Enlarge the drawing to fill the room between the labels and the key line, centre field and sheet 
    under their labels, and draw the field outline and meridian in hairline.
  rationale: "Compared with references/last_frame.jpg, the first snapshots drew the field and the sheet at the original
    scene's size while the labels and the key line sit at the style's safe-area anchors, higher and lower than the
    original placed them by hand, so the labels floated about 0.85 units above the drawing and the key line 0.7
    units below it (the original: about 0.3 and 0.25). A zoom of 1.12 on the original geometry fills that room (gaps
    of about 0.48 units above and below), and an offset of (0.323, 0.08) original units with the sheet's centre
    at 3.825 instead of 3.9 puts the field just right of its label's start and the sheet centred under its label
    inside the safe area. The dots keep the original's radius relative to the field (0.05 original units). Under
    lecturekit_dark@0.1.0 the outline and the meridian in grid (#151515 on a black page, contrast 1.15) all but
    vanished; hairline is the original scene's colour for them (HAIR) and is the brand's hairline in both styles
    (contrast 1.75 on the paper page, 1.46 on the black one). Only layout and two colour roles change; no number,
    label or event does."
  based_on_revision: working
  in_response_to: []
  uncertainties:
    - direction.prefer asks for the field outline and meridian in grid; under the dark style grid is nearly 
      the page colour, so this uses hairline, the original's colour. If the lecturer wants it quieter on 
      paper, grid could return there only through a style change.
  claims: []
  targets:
    - file: storyboard.yaml
      patch:
        - op: replace
          path: /scenes/0/objects/0/params/arguments/page
          value:
            original_frame_height: 9
            zoom: 1.12
            offset:
              - 0.323
              - 0.08
        - op: replace
          path: /scenes/0/objects/0/params/arguments/roles/outline
          value: hairline
        - op: replace
          path: /scenes/0/objects/0/params/arguments/roles/meridian
          value: hairline
        - op: replace
          path: /scenes/0/objects/1/params/arguments/sheet/centre_x
          value: 3.825
        - op: remove
          path: /scenes/0/objects/1/params/arguments/dot_radius_px_at_1080p
        - op: add
          path: /scenes/0/objects/1/params/arguments/dot_radius
          value: 0.05
  touches_science: false
applied_at: '2026-11-13T15:07:29+00:00'
applied_to_revision: working
