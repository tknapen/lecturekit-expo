scientific_review_required: true
validation_warnings:
  - "action 'fits_run' moves at constant speed from its first frame to its last (easing: linear); the style asks
    for slow in, slow out: omit `easing` to use `smooth`, or keep linear only for a motion that should read as mechanical"
  - scene 'map' names pattern 'linked_views' but uses none of its components (function_plot, surface_plot, 
    function_image)
