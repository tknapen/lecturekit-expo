# Render environment for the population_receptive_fields family: `uv sync` here creates .venv with Manim and the
# manim8 render bridge. The control plane (`manim8`) is deliberately absent. uv.lock is shareable; .venv is not.
[project]
name = "family-population-receptive-fields"
version = "0.1.0"
description = "Pinned render environment for the population_receptive_fields family."
requires-python = ">=3.12"
# manim8-core is listed explicitly so that uv applies its source (ADR-008).
dependencies = ["manim8-bridge", "manim8-core"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.uv.sources]
# The bridge and the contracts from git: the commit the control plane was installed from (ADR-043).
manim8-bridge = { git = "https://github.com/tknapen/manim8", rev = "bad3ae125aa36d2672f5b86cd601ee1673570334", subdirectory = "packages/scianim_bridge" }
manim8-core = { git = "https://github.com/tknapen/manim8", rev = "bad3ae125aa36d2672f5b86cd601ee1673570334", subdirectory = "packages/scianim_core" }
