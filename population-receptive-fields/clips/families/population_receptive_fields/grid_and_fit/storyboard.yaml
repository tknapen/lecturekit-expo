    snapshots:
      - id: layout
        at_seconds: 1.2
        description: "The layout, fully revealed (every object fades in over the style's reveal time from 0 s):
          left, the field out to 4 deg with fixation, the 2 deg scale bar and the heading 'grid search'; right,
          the measured voxel's time course on 'time (s)' and 'BOLD (% signal change)', labelled 'measured voxel'.
          The first candidate (seq 0, x -1.00, y -3.00, sigma 2.00 deg, R squared 0.00) with its prediction over
          the data."
      - id: slow_candidates
        at_seconds: 5.4
        description: Rest after the fourth slow candidate (seq 3, x +1.00, y +0.00, sigma 0.50 deg, R squared 
          0.33); it is also the best so far, so its dashed outline lies under the candidate's circle.
      - id: fast_grid
        at_seconds: 6.3
        description: In the fast phase, the end of the hop to seq 10 (x -2.00, y -2.00, sigma 2.00 deg, R 
          squared 0.00); the dashed outline keeps the best so far, seq 7 (x +1.00, y +1.00, sigma 0.50 deg, R 
          squared 0.47).
      - id: grid_best
        at_seconds: 11.5
        description: Rest on the best grid point (seq 52, x +2.00, y +1.00, sigma 1.00 deg, R squared 0.84); 
          the dashed outline coincides with it.
      - id: refinement
        at_seconds: 12.7
        description: The heading reads 'refinement' and the dashed outline is gone; the candidate is still on 
          the best grid point, the moment before the first refinement step.
      - id: optimum
        at_seconds: 16.8
        description: After eleven refinement steps, the optimum (seq 63, x +2.27, y +0.99, sigma 0.85 deg, R 
          squared 0.86); the prediction lies on the data. No fit line yet.
      - id: result
        at_seconds: 19.9
        description: "The end state and study still: the optimum with its prediction over the measured voxel, the
          readouts x +2.27, y +0.99, sigma 0.85 deg and R squared 0.86, the heading 'refinement' and, under the
          time course, 'fit: x 2.27°, y 0.99°, σ 0.85°, R² 0.86'."
