schema_version: '1.0'
project_id: grid_and_fit
based_on_animation_revision: working
scenes:
  - id: fit
    start_seconds: 0
    end_seconds: 20.0
    purpose: "One candidate position drives two pictures: the candidate field in the visual field and its predicted
      time course over the measured voxel, with x, y, sigma and R squared read out. Four slow candidates, 48 fast
      ones with the best so far kept as a dashed outline, the best grid point, then eleven refinement steps to the
      optimum and the line with the fitted values. The candidate_path object's parameters candidate and retire_kept
      are declared as zero-window smooth transforms of its binding, which leave the table unchanged (manim8 declares
      a custom object's parameters only there)."
    patterns:
      - linked_views
    objects:
      - id: visual_field
        kind: custom
        params:
          builder: grid_fit:visual_field
          arguments:
            radius_deg: 4
            scale_bar_deg: 2
            roles:
              outline: hairline
              fixation: muted
              scale_bar: muted
            weights_px_at_1080p:
              outline: 3.6
              fixation: 3.1
              scale_bar: 3.6
      - id: time_course
        kind: custom
        style_role: foreground
        data:
          source: timecourses
          encoding:
            x: t_s
            y: measured
        params:
          builder: grid_fit:time_course
          arguments:
            time_range:
              - 0
              - 306
            value_range:
              - -3.36
              - 8.07
            time_ticks:
              - 0
              - 100
              - 200
              - 300
            time_label: time (s)
            value_label: BOLD (% signal change)
            label: measured voxel
            roles:
              axes: muted
              ticks: secondary_text
              axis_labels: secondary_text
            weights_px_at_1080p:
              axes: 1.9
              trace: 3.0
      - id: heading_grid
        kind: custom
        style_role: muted
        params:
          builder: grid_fit:field_heading
          arguments:
            field: visual_field
            text: grid search
            text_role: body
      - id: heading_refine
        kind: custom
        style_role: muted
        reveal_at_seconds: 11.8
        params:
          builder: grid_fit:field_heading
          arguments:
            field: visual_field
            text: refinement
            text_role: body
      - id: candidate_path
        kind: custom
        data:
          source: candidates
          encoding:
            x: seq
            y: r2
          transforms:
            - op: smooth
              column: seq
              window:
                parameter: candidate
                default: 0
            - op: smooth
              column: seq
              window:
                parameter: retire_kept
                default: 0
        params:
          builder: grid_fit:candidate_path
          arguments:
            field: visual_field
            panel: time_course
            columns:
              x: x_deg
              y: y_deg
              sigma: sigma_deg
              r2: r2
              phase: phase
            predictions:
              source: timecourses
              time: t_s
              prefix: p
            kept_phases:
              - slow
              - fast
              - grid_best
            roles:
              candidate: primary_signal
              kept: muted
            text_roles:
              params: annotation
              r2: body
            weights_px_at_1080p:
              candidate: 4.8
              kept: 2.4
              prediction: 4.2
            dot_radius_px_at_1080p: 7
            dash_px_at_1080p: 9
      - id: fit_line
        kind: custom
        style_role: foreground
        reveal_at_seconds: 17.0
        params:
          builder: grid_fit:panel_text
          arguments:
            panel: time_course
            text: 'fit: x 2.27°, y 0.99°, σ 0.85°, R² 0.86'
            text_role: body
    actions:
      - id: hop_01
        kind: vary_parameter
        target: candidate_path
        parameter: candidate
        to: 1
        at_seconds: 1.4
        duration_seconds: 0.9
        show_value: false
