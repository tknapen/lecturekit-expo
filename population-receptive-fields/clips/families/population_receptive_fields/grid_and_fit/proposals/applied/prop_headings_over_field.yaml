schema_version: '1.0'
proposal:
  schema_version: '1.0'
  id: prop_headings_over_field
  kind: revise_storyboard
  created_at: '2026-11-13T16:20:00+00:00'
  author: agent:clip-grid_and_fit
  summary: Centre the two headings over the field, correct the fast_grid description, align the fit line with 
    the readout under the field.
  rationale: The first checkpoints put 'grid search' and 'refinement' at the top-left anchor of the safe area,
    a heading's height and a half above the field and left of it, where it reads as a slide title; in the 
    original scene and the reference frame the heading is centred over the field, just above it. A 
    text_caption can only sit at an anchor of the safe area or left-aligned below or beside an earlier object 
    (place() in scianim_bridge.components.base), so the headings become the custom builder 
    grid_fit:field_heading, which sets the text centred above the field at the original's height; the change 
    of heading stays the registered fade_object and reveal_at_seconds. The fast_grid snapshot described the 
    kept outline as seq 5; the best of seq 0 to 10 is seq 7 (r2 0.473), which the checkpoint shows. The fit 
    line sat a little above the x, y, sigma readout under the field; a gap of 64 px puts the two lines of text
    on one level, as in the reference frame.
  based_on_revision: working
  in_response_to: []
  uncertainties: []
  claims:
    - statement: Among seq 0 to 10 of the grid search, the highest r2 is seq 7 (x 1, y 1, sigma 0.5 deg, r2 
        0.473).
      source_id: candidates
      locator: rows seq 0 to 10, column r2
      basis: source
    - statement: The heading is centred over the field, above it.
      source_id: original_scene
      locator: head = label('grid search', 30, MUTED).move_to([-5.2, 3.3, 0]); VisualField((-5.2, 0.2), 2.3)
      basis: source
  targets:
    - file: storyboard.yaml
      patch:
        - op: replace
          path: /scenes/0/objects/3
          value:
            id: heading_grid
            kind: custom
            style_role: muted
            params:
              builder: grid_fit:field_heading
              arguments:
                field: visual_field
                text: grid search
                text_role: body
        - op: replace
          path: /scenes/0/objects/4
          value:
            id: heading_refine
            kind: custom
            style_role: muted
            reveal_at_seconds: 11.8
            params:
              builder: grid_fit:field_heading
              arguments:
                field: visual_field
                text: refinement
                text_role: body
        - op: replace
          path: /scenes/0/objects/6/params/gap_px_at_1080p
          value: 64
        - op: replace
          path: /scenes/0/snapshots/2/description
          value: In the fast phase, the end of the hop to seq 10 (x -2.00, y -2.00, sigma 2.00 deg, R squared 
            0.00); the dashed outline keeps the best so far, seq 7 (x +1.00, y +1.00, sigma 0.50 deg, R 
            squared 0.47).
  touches_science: false
applied_at: '2026-11-13T15:05:43+00:00'
applied_to_revision: working
