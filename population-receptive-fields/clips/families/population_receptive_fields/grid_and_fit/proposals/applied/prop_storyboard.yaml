schema_version: '1.0'
proposal:
  schema_version: '1.0'
  id: prop_storyboard
  kind: create_storyboard
  created_at: '2026-11-13T16:00:00+00:00'
  author: agent:clip-grid_and_fit
  summary: 'Storyboard of the grid search and refinement of a pRF fit: one hop action per candidate of candidates.csv
    driving a custom parametric object, over a registered scientific_plot of the measured voxel.'
  rationale: "The brief and the original scene: four slow candidates, 48 fast ones with the best so far kept as
    a dashed outline, the best grid point (R squared 0.84), the heading change, eleven refinement steps to the optimum
    (R squared 0.86), the fit line. The measured trace, its axes, the headings and the fit line are registered kinds
    (scientific_plot, text_caption) with registered actions (reveal, fade_object); what the registry cannot draw
    (the field in degrees, a label at the plot's top left, the candidate with its prediction, readouts and kept
    outline) is kind: custom in code/grid_fit.py, and the motion is the parametric route: the candidate_path object
    is a ParametricComponent swept by vary_parameter, one action per hop."
  based_on_revision: working
  in_response_to: []
  uncertainties:
    - The time column t_s is the scan time truncated to whole seconds (floor of 0.9 s times the sample index),
      so 34 pairs of samples share a second; the traces are drawn against t_s as given, which moves a sample 
      by at most 0.9 s (under 3 px at 1280 wide). The citation says '340 s' for 340 samples spanning 0 to 305 
      s.
    - Between two candidates, while a hop runs, centre, sigma, the readouts and the prediction are 
      interpolated linearly between the two rows, as the original scene's trackers did; only the rest frames 
      are exact rows.
    - "Frame 0 is the page colour: manim8 reveals every object at a scene's start over the style's reveal time (0.85
      s), so the layout of the hard milestone at 0 s is complete at 0.85 s."
  claims:
    - statement: Each candidate shown is a row of candidates.csv in seq order (4 slow, 48 fast, the grid's 
        best, 11 refinement steps), drawn at its x_deg, y_deg and sigma_deg with its r2 to two decimals.
      source_id: candidates
      locator: columns seq, phase, x_deg, y_deg, sigma_deg, r2; rows 0 to 63
      basis: source
    - statement: The prediction of candidate n is column p<n> of timecourses.csv, on the time axis t_s.
      source_id: timecourses
      locator: columns t_s and p00 to p63
      basis: source
    - statement: The time course is one measured voxel of prfmodel's example dataset 7t-aot-visual, sub-003, 
        in per cent signal change; it is labelled 'measured voxel', the prediction is not labelled.
      source_id: timecourses
      locator: column measured; citation
      basis: source
    - statement: 'The fit ends at x 2.27 deg, y 0.99 deg, sigma 0.85 deg, R squared 0.86 (row 63: 2.27, 0.995, 0.847,
        0.862; y written as 0.99, as the constraint final_values says).'
      source_id: candidates
      locator: row seq 63
      basis: source
    - statement: Layout, positions, line weights and the order and pace of events follow the original scene.
      source_id: original_scene
      locator: FitSearch.construct
      basis: source
  targets:
    - file: storyboard.yaml
      document:
        schema_version: '1.0'
        project_id: grid_and_fit
        based_on_animation_revision: working
        scenes:
          - id: fit
            start_seconds: 0
            end_seconds: 20.0
            purpose: "One candidate position drives two pictures: the candidate field in the visual field and its
              predicted time course over the measured voxel, with x, y, sigma and R squared read out. Four slow
              candidates, 48 fast ones with the best so far kept as a dashed outline, the best grid point, then
              eleven refinement steps to the optimum and the line with the fitted values. The candidate_path object's
              parameters candidate and retire_kept are declared as zero-window smooth transforms of its binding,
              which leave the table unchanged (manim8 declares a custom object's parameters only there)."
            patterns:
              - linked_views
            objects:
              - id: visual_field
                kind: custom
                params:
                  builder: grid_fit:visual_field
                  arguments:
                    radius_deg: 4
                    scale_bar_deg: 2
                    roles:
                      outline: hairline
                      fixation: muted
                      scale_bar: muted
                    weights_px_at_1080p:
                      outline: 3.6
                      fixation: 3.1
                      scale_bar: 3.6
              - id: bold_plot
                kind: scientific_plot
                style_role: foreground
                data:
                  source: timecourses
                  encoding:
                    x: t_s
                    y: measured
                params:
                  x_label: time (s)
                  y_label: BOLD (% signal change)
                  x_range:
                    - 0
                    - 306
                  y_range:
                    - -5
                    - 10
                  show_points: false
                  show_legend: false
                  anchor: center_right
                  width_fraction: 0.595
                  height_fraction: 0.529
              - id: voxel_label
                kind: custom
                style_role: foreground
                params:
                  builder: grid_fit:plot_label
                  arguments:
                    plot: bold_plot
                    text: measured voxel
                    text_role: annotation
              - id: heading_grid
                kind: text_caption
                style_role: muted
                params:
                  text: grid search
                  role: body
                  anchor: top_left
              - id: heading_refine
                kind: text_caption
                style_role: muted
                reveal_at_seconds: 11.8
                params:
                  text: refinement
                  role: body
                  anchor: top_left
              - id: candidate_path
                kind: custom
                data:
                  source: candidates
                  encoding:
                    x: seq
                    y: r2
                  transforms:
                    - op: smooth
                      column: seq
                      window:
                        parameter: candidate
                        default: 0
                    - op: smooth
                      column: seq
                      window:
                        parameter: retire_kept
                        default: 0
                params:
                  builder: grid_fit:candidate_path
                  arguments:
                    field: visual_field
                    plot: bold_plot
                    columns:
                      x: x_deg
                      y: y_deg
                      sigma: sigma_deg
                      r2: r2
                      phase: phase
                    predictions:
                      source: timecourses
                      time: t_s
                      prefix: p
                    kept_phases:
                      - slow
                      - fast
                      - grid_best
                    roles:
                      candidate: primary_signal
                      kept: muted
                    text_roles:
                      params: annotation
                      r2: body
                    weights_px_at_1080p:
                      candidate: 4.8
                      kept: 2.4
                      prediction: 4.2
                    dot_radius_px_at_1080p: 7
                    dash_px_at_1080p: 9
              - id: fit_line
                kind: text_caption
                style_role: foreground
                reveal_at_seconds: 17.0
                params:
                  text: 'fit: x 2.27°, y 0.99°, σ 0.85°, R² 0.86'
                  role: body
                  below: bold_plot
                  gap_px_at_1080p: 40
            actions:
