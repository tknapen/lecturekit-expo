schema_version: '1.0'
proposal:
  schema_version: '1.0'
  id: prop_fixed_panel
  kind: revise_storyboard
  created_at: '2026-11-13T16:55:00+00:00'
  author: agent:clip-grid_and_fit
  summary: Draw the measured time course and the fit line at fixed places, so the geometry is identical under 
    both styles.
  rationale: "The final renders under lecturekit_paper and lecturekit_dark put the registered scientific_plot's
    axes box 1.21 px apart vertically and 0.28 px horizontally (paper: left 532.54 px, bottom 506.16 px; dark: 532.26,
    504.95), because the registry places the plot by the bounding box of its group, which holds the tick and axis
    labels, and those follow the font (TeX Gyre Heros and Roboto). The lecturer's rule is that geometry is identical
    under both styles, so the page can swap one video for the other. The measured trace, its axes and labels become
    the builder grid_fit:time_course, which draws them in the original scene's axes box (Frame(-1.6, -2.0, 8.8,
    4.4), y from the data's minimum minus 0.5 to its maximum plus 0.5, as the original) fitted into the safe area
    like the field; the fit line becomes grid_fit:panel_text, centred under the axes at the original's place, since
    a text_caption placed below the panel would follow the panel's labels and be left-aligned. This also brings
    the panel to the reference frame: thin muted axes, time ticks only, 'measured voxel' at the top left in the
    trace's ink, and the fit line centred under the time axis. Tick and axis labels take secondary_text, which reads
    on the dark page (muted is 3.5 to 1 there)."
  based_on_revision: working
  in_response_to: []
  uncertainties: []
  claims:
    - statement: The panel's value range is the measured voxel's minimum minus 0.5 to its maximum plus 0.5 
        (-2.86 and 7.57 in the column measured), and its time range 0 to 306 s, as in the original scene.
      source_id: original_scene
      locator: D = Frame(-1.6, -2.0, 8.8, 4.4, (0, T_END), (Y.min() - 0.5, Y.max() + 0.5))
      basis: source
    - statement: The measured trace is the column measured of timecourses.csv against t_s, untransformed.
      source_id: timecourses
      locator: columns t_s, measured
      basis: source
  targets:
    - file: storyboard.yaml
      patch:
        - op: replace
          path: /scenes/0/objects
          value:
            - id: visual_field
              kind: custom
              params:
                builder: grid_fit:visual_field
                arguments:
                  radius_deg: 4
                  scale_bar_deg: 2
                  roles:
                    outline: hairline
                    fixation: muted
                    scale_bar: muted
                  weights_px_at_1080p:
                    outline: 3.6
                    fixation: 3.1
                    scale_bar: 3.6
            - id: time_course
              kind: custom
              style_role: foreground
              data:
                source: timecourses
                encoding:
                  x: t_s
                  y: measured
              params:
                builder: grid_fit:time_course
                arguments:
                  time_range:
                    - 0
                    - 306
                  value_range:
                    - -3.36
                    - 8.07
                  time_ticks:
                    - 0
                    - 100
                    - 200
                    - 300
                  time_label: time (s)
                  value_label: BOLD (% signal change)
                  label: measured voxel
                  roles:
                    axes: muted
                    ticks: secondary_text
                    axis_labels: secondary_text
                  weights_px_at_1080p:
                    axes: 1.9
                    trace: 3.0
            - id: heading_grid
              kind: custom
              style_role: muted
              params:
                builder: grid_fit:field_heading
                arguments:
                  field: visual_field
                  text: grid search
                  text_role: body
            - id: heading_refine
              kind: custom
              style_role: muted
              reveal_at_seconds: 11.8
              params:
                builder: grid_fit:field_heading
                arguments:
                  field: visual_field
                  text: refinement
                  text_role: body
            - id: candidate_path
              kind: custom
              data:
                source: candidates
                encoding:
                  x: seq
                  y: r2
                transforms:
                  - op: smooth
                    column: seq
                    window:
                      parameter: candidate
                      default: 0
                  - op: smooth
                    column: seq
                    window:
                      parameter: retire_kept
                      default: 0
              params:
                builder: grid_fit:candidate_path
                arguments:
                  field: visual_field
                  panel: time_course
                  columns:
                    x: x_deg
                    y: y_deg
                    sigma: sigma_deg
                    r2: r2
                    phase: phase
                  predictions:
                    source: timecourses
                    time: t_s
                    prefix: p
                  kept_phases:
                    - slow
                    - fast
                    - grid_best
                  roles:
                    candidate: primary_signal
                    kept: muted
                  text_roles:
                    params: annotation
                    r2: body
                  weights_px_at_1080p:
                    candidate: 4.8
                    kept: 2.4
                    prediction: 4.2
                  dot_radius_px_at_1080p: 7
                  dash_px_at_1080p: 9
            - id: fit_line
              kind: custom
              style_role: foreground
              reveal_at_seconds: 17.0
              params:
                builder: grid_fit:panel_text
                arguments:
                  panel: time_course
                  text: 'fit: x 2.27°, y 0.99°, σ 0.85°, R² 0.86'
                  text_role: body
  touches_science: true
applied_at: '2026-11-13T15:24:18+00:00'
applied_to_revision: working
