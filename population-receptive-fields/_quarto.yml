project:
  type: default
  output-dir: _build
  render:
    - slides.qmd
  pre-render:
    - make_assets.py          # figures from assets/data, on lecturekit.tikz
  resources:
    - /assets/**              # the clips and data, referenced from raw HTML (anchored: not _build/assets)

# the lecturekit formats come from the vendored extension (lk new --vendor-only . to update)
format:
  lecturekit-revealjs:
    output-file: slides-live.html
  lecturekit-beamer:
    output-file: slides-study.pdf
    # links in the brand's input colour: Pandoc's own \hypersetup sets urlcolor=Blue after the engine's, which is
    # 2.4:1 on the dark page; nmInput is the preset's input colour, 9.3:1 on black and 5.2:1 on white
    urlcolor: nmInput

brand: _brand.yml

# the deck's own keys (budget, shorttitle, eyebrow, citation-size) live in slides.qmd's front matter

# escape hatches for one-off tweaks (keep them empty if you can)
# format:
#   lecturekit-revealjs:
#     css: [project.css]
#   lecturekit-beamer:
#     include-in-header: [project.tex]
